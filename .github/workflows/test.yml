name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check the inline script
        run: |
          node -e "const s=require('fs').readFileSync('index.html','utf8');require('fs').writeFileSync(process.env.RUNNER_TEMP+'/app.js',s.match(/<script>([\s\S]*)<\/script>/)[1])"
          node --check "$RUNNER_TEMP/app.js"

      - name: No network access (privacy invariant)
        run: |
          if grep -nE "fetch\(|XMLHttpRequest|sendBeacon|WebSocket|EventSource|<script src|<link rel|@import|url\(http|<iframe" index.html; then
            echo "::error::index.html contains a network-capable construct. Threadline must make no network requests (see CLAUDE.md)."
            exit 1
          fi

      - name: Parser and stats unit tests
        run: node --test "tests/*.test.cjs"

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dev-only dependency, not committed: the app itself has none. Pinned to the version the test was written against.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Smoke test (desktop and 390px mobile)
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          SHOTS="$RUNNER_TEMP/shots" node tools/smoke.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7
